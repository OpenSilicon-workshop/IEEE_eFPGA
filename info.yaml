# Tiny Tapeout project information
project:
  title: "IEEE Mini eFPGA (4-cell LUT4 fabric)"
  author: "Hadjer Bouyahiaoui, Ines Mekkid, Ibrahim Touil"            
  discord: ""
  description: "A minimal embedded FPGA: 4 logic cells, each a LUT4 with a registered output, fully crossbar-connected, configured over a 112-bit serial chain."
  language: "Verilog"
  clock_hz: 10000000             # 10 MHz - conservative for a mux-deep fabric
  tiles: "1x2"                   # valid: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2, 8x2
  top_module: "tt_um_minifpga"   # <-- make unique, e.g. tt_um_yourgithub_minifpga
  source_files:
    - "project.v"

pinout:
  ui[0]: "fabric input 0"
  ui[1]: "fabric input 1"
  ui[2]: "fabric input 2"
  ui[3]: "fabric input 3"
  ui[4]: "cfg_en - high to shift configuration"
  ui[5]: "cfg_din - configuration data in"
  ui[6]: ""
  ui[7]: ""

  uo[0]: "cell 0 output"
  uo[1]: "cell 1 output"
  uo[2]: "cell 2 output"
  uo[3]: "cell 3 output"
  uo[4]: "cfg_dout - end of config chain"
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  uio[0]: ""
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change
yaml_version: 6
